<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>MyDukaan v2 — Cinematic Business OS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#00D4FF;--blue2:#0099FF;--blue3:#0066FF;--blue4:#003BFF;
  --glow1:rgba(0,212,255,0.35);--glow2:rgba(0,153,255,0.2);
  --bg:#050505;--bg2:#070B14;--bg3:#0A1020;--bg4:#0D1528;--bg5:#111A32;
  --glass:rgba(0,212,255,0.04);--glass2:rgba(0,212,255,0.08);--glass3:rgba(255,255,255,0.03);
  --border:rgba(0,212,255,0.12);--border2:rgba(0,212,255,0.2);--border3:rgba(255,255,255,0.06);
  --tx:#F0F8FF;--tx2:#7DB9D4;--tx3:#3A5A70;
  --success:#00E5A0;--warn:#FFB340;--danger:#FF3D71;--gold:#FFD700;
  --r:16px;--r2:12px;--r3:8px;
  --sh:0 8px 32px rgba(0,0,0,.7);
  --glow:0 0 40px var(--glow1);
  --glow-s:0 0 20px rgba(0,229,160,0.3);
  --glow-d:0 0 20px rgba(255,61,113,0.3);
  --glow-w:0 0 20px rgba(255,179,64,0.3);
  --f:'DM Sans',sans-serif;
  --fd:'Syne',sans-serif;
}
html{height:100%;scroll-behavior:smooth;background:var(--bg)}
body{font-family:var(--f);background:var(--bg);color:var(--tx);min-height:100%;overflow-x:hidden;line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--blue3);border-radius:3px}
input,select,textarea,button{font-family:var(--f)}
a{text-decoration:none;color:inherit}
button{cursor:pointer}

/* ══════════ CANVAS PARTICLES ══════════ */
#particle-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.7}

/* ══════════ LAYOUT ══════════ */
#app{position:relative;z-index:1;min-height:100vh}

/* ══════════ AUTH SCREEN ══════════ */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.auth-orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;animation:orbFloat 6s ease-in-out infinite}
.auth-orb-1{width:400px;height:400px;background:radial-gradient(circle,rgba(0,102,255,0.4),transparent 70%);top:-100px;left:-100px;animation-delay:0s}
.auth-orb-2{width:350px;height:350px;background:radial-gradient(circle,rgba(0,212,255,0.3),transparent 70%);bottom:-80px;right:-80px;animation-delay:-3s}
.auth-orb-3{width:200px;height:200px;background:radial-gradient(circle,rgba(0,59,255,0.35),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-1.5s}
@keyframes orbFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
.auth-card{width:100%;max-width:400px;background:rgba(7,11,20,0.85);backdrop-filter:blur(40px);border:1px solid var(--border2);border-radius:24px;padding:36px 28px;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.8),0 0 80px rgba(0,102,255,0.15)}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--blue),transparent)}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;justify-content:center}
.auth-logo-icon{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--blue3),var(--blue));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 30px rgba(0,153,255,.5)}
.auth-logo-text{font-family:var(--fd);font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--blue),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-title{font-family:var(--fd);font-size:26px;font-weight:800;text-align:center;margin-bottom:6px}
.auth-sub{color:var(--tx2);font-size:14px;text-align:center;margin-bottom:28px}
.auth-inp-wrap{position:relative;margin-bottom:14px}
.auth-inp{width:100%;background:rgba(0,212,255,0.04);border:1.5px solid var(--border);border-radius:var(--r2);padding:14px 16px;color:var(--tx);font-size:14px;transition:all .3s;outline:none}
.auth-inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,212,255,.08),0 0 20px rgba(0,212,255,.1);background:rgba(0,212,255,.06)}
.auth-inp::placeholder{color:var(--tx3)}
.auth-inp-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:16px;pointer-events:none}
.auth-inp.has-icon{padding-left:44px}
.eye-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--tx3);font-size:14px;cursor:pointer;transition:color .2s}
.eye-toggle:hover{color:var(--blue)}
.auth-btn{width:100%;padding:15px;border-radius:var(--r2);border:none;background:linear-gradient(135deg,var(--blue3),var(--blue));color:#fff;font-family:var(--fd);font-size:15px;font-weight:700;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;margin-top:6px;box-shadow:0 8px 30px rgba(0,102,255,.4)}
.auth-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);opacity:0;transition:opacity .3s}
.auth-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,102,255,.6)}
.auth-btn:hover::after{opacity:1}
.auth-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--tx3);font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.social-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.social-btn{padding:12px;border-radius:var(--r2);border:1.5px solid var(--border);background:rgba(255,255,255,.02);color:var(--tx2);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.social-btn:hover{border-color:var(--blue);color:var(--tx);background:rgba(0,212,255,.04)}
.auth-switch{text-align:center;margin-top:20px;font-size:13px;color:var(--tx2)}
.auth-switch span{color:var(--blue);cursor:pointer;font-weight:600}
.auth-switch span:hover{text-decoration:underline}
.otp-inputs{display:flex;gap:10px;justify-content:center;margin:20px 0}
.otp-inp{width:48px;height:54px;text-align:center;font-size:20px;font-weight:800;font-family:var(--fd);background:rgba(0,212,255,.04);border:1.5px solid var(--border);border-radius:var(--r2);color:var(--tx);outline:none;transition:all .3s}
.otp-inp:focus{border-color:var(--blue);box-shadow:0 0 20px rgba(0,212,255,.15)}
.auth-view{display:none}
.auth-view.active{display:block;animation:slideUp .35s ease}

/* ══════════ LANDING ══════════ */
.landing{min-height:100vh;overflow-x:hidden}
.land-nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(5,5,5,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.land-logo{display:flex;align-items:center;gap:10px}
.land-logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue3),var(--blue));display:flex;align-items:center;justify-content:center;font-size:16px}
.land-logo-text{font-family:var(--fd);font-size:18px;font-weight:800;background:linear-gradient(90deg,var(--blue),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.land-nav-btns{display:flex;gap:8px}
.land-nav-btn{padding:8px 16px;border-radius:var(--r2);font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .2s}
.land-nav-btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--tx2)}
.land-nav-btn.ghost:hover{border-color:var(--blue);color:var(--blue)}
.land-nav-btn.solid{background:linear-gradient(135deg,var(--blue3),var(--blue));color:#fff;box-shadow:0 4px 20px rgba(0,102,255,.4)}
.land-nav-btn.solid:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(0,102,255,.6)}

.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px 60px;text-align:center;position:relative}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:100px;background:rgba(0,212,255,.06);border:1px solid var(--border2);font-size:12px;font-weight:600;color:var(--blue);margin-bottom:24px;animation:badgePulse 3s ease-in-out infinite}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(0,212,255,0)}50%{box-shadow:0 0 20px rgba(0,212,255,.2)}}
.hero-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hero-h1{font-family:var(--fd);font-size:clamp(32px,8vw,52px);font-weight:800;line-height:1.1;letter-spacing:-1.5px;margin-bottom:20px;background:linear-gradient(180deg,#fff 0%,var(--blue) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:15px;color:var(--tx2);line-height:1.7;max-width:380px;margin:0 auto 36px}
.hero-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;margin:0 auto}
.hero-btn-primary{padding:16px 28px;border-radius:var(--r);background:linear-gradient(135deg,var(--blue3),var(--blue));color:#fff;font-family:var(--fd);font-size:16px;font-weight:700;border:none;cursor:pointer;transition:all .3s;box-shadow:0 8px 40px rgba(0,102,255,.5),inset 0 1px 0 rgba(255,255,255,.1)}
.hero-btn-primary:hover{transform:translateY(-3px);box-shadow:0 16px 50px rgba(0,102,255,.7)}
.hero-btn-ghost{padding:16px 28px;border-radius:var(--r);background:rgba(255,255,255,.04);color:var(--tx);font-family:var(--fd);font-size:15px;font-weight:600;border:1.5px solid var(--border2);cursor:pointer;transition:all .3s}
.hero-btn-ghost:hover{border-color:var(--blue);background:rgba(0,212,255,.04);color:var(--blue)}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:48px;width:100%;max-width:500px}
.stat-pill{background:rgba(0,212,255,.04);border:1px solid var(--border);border-radius:var(--r2);padding:16px 12px;text-align:center}
.stat-pill-val{font-family:var(--fd);font-size:24px;font-weight:800;color:var(--blue)}
.stat-pill-lbl{font-size:11px;color:var(--tx3);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

.dashboard-preview{margin:60px auto 0;width:100%;max-width:380px;background:rgba(7,11,20,.9);backdrop-filter:blur(20px);border:1px solid var(--border2);border-radius:24px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.8),0 0 80px rgba(0,102,255,.15);animation:floatPreview 5s ease-in-out infinite}
@keyframes floatPreview{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.dp-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.dp-dots{display:flex;gap:5px}
.dp-dot{width:8px;height:8px;border-radius:50%}
.dp-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px;background:var(--bg2)}
.dp-kpi{padding:12px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r2)}
.dp-kpi-val{font-family:var(--fd);font-size:18px;font-weight:800;color:var(--blue)}
.dp-kpi-lbl{font-size:10px;color:var(--tx3);margin-top:2px}
.dp-chart{padding:12px 16px;height:80px;display:flex;align-items:flex-end;gap:4px}
.dp-bar{flex:1;border-radius:3px 3px 0 0;background:linear-gradient(to top,var(--blue3),var(--blue));opacity:.7;transition:height .5s}
.dp-bar.hi{opacity:1;box-shadow:0 0 10px rgba(0,212,255,.5)}

.marquee-section{padding:40px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden;position:relative;background:rgba(0,212,255,.02)}
.marquee-track{display:flex;gap:32px;animation:marquee 20s linear infinite;white-space:nowrap}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.marquee-item{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--tx2);flex-shrink:0}
.marquee-item::after{content:'·';color:var(--tx3);margin-left:22px}

.features-section{padding:60px 20px}
.section-title{font-family:var(--fd);font-size:26px;font-weight:800;text-align:center;margin-bottom:8px;background:linear-gradient(180deg,#fff,var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.section-sub{text-align:center;color:var(--tx2);font-size:14px;margin-bottom:32px}
.features-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feat-card{background:rgba(7,11,20,.8);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--r);padding:20px 16px;transition:all .3s;position:relative;overflow:hidden}
.feat-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,102,255,.05),transparent);opacity:0;transition:opacity .3s}
.feat-card:hover{border-color:var(--blue);box-shadow:0 0 30px rgba(0,102,255,.15),var(--sh);transform:translateY(-3px)}
.feat-card:hover::before{opacity:1}
.feat-icon{font-size:26px;margin-bottom:12px}
.feat-title{font-family:var(--fd);font-size:15px;font-weight:700;margin-bottom:6px}
.feat-desc{font-size:12px;color:var(--tx2);line-height:1.6}

/* ══════════ MOBILE APP SHELL ══════════ */
.app-shell{display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}
.top-bar{position:fixed;top:0;left:0;right:0;z-index:200;padding:12px 16px 10px;background:rgba(5,5,5,.92);backdrop-filter:blur(30px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.tb-logo{display:flex;align-items:center;gap:8px}
.tb-logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue3),var(--blue));display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 0 15px rgba(0,153,255,.4)}
.tb-logo-text{font-family:var(--fd);font-size:16px;font-weight:800;background:linear-gradient(90deg,var(--blue),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tb-actions{display:flex;align-items:center;gap:8px}
.tb-btn{width:36px;height:36px;border-radius:10px;background:var(--glass2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;transition:all .2s}
.tb-btn:hover{border-color:var(--blue);background:rgba(0,212,255,.1)}
.tb-notif{position:relative}
.notif-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:1.5px solid var(--bg);box-shadow:0 0 6px rgba(255,61,113,.5)}

.page-body{padding:70px 0 80px;flex:1;overflow-y:auto}
.page-content{padding:16px}

/* ══════════ BOTTOM NAV ══════════ */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(7,11,20,.95);backdrop-filter:blur(30px);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.bn-items{display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 0;color:var(--tx3);transition:all .2s;position:relative}
.bn-item.active{color:var(--blue)}
.bn-icon{font-size:20px;transition:transform .2s}
.bn-item.active .bn-icon{transform:scale(1.1)}
.bn-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.bn-glow{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:2px;border-radius:2px;background:var(--blue);box-shadow:0 0 8px var(--blue);opacity:0;transition:opacity .3s}
.bn-item.active .bn-glow{opacity:1}

/* ══════════ FAB ══════════ */
.fab{position:fixed;bottom:80px;right:16px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--blue3),var(--blue));border:none;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 8px 30px rgba(0,102,255,.6),0 0 40px rgba(0,212,255,.2);z-index:190;transition:all .3s;display:flex;align-items:center;justify-content:center}
.fab:hover{transform:scale(1.1) rotate(15deg);box-shadow:0 12px 40px rgba(0,102,255,.8)}
.fab:active{transform:scale(.95)}

/* ══════════ COMPONENTS ══════════ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:var(--r2);font-size:13.5px;font-weight:600;cursor:pointer;border:none;transition:all .2s;white-space:nowrap;line-height:1;font-family:var(--f)}
.btn-primary{background:linear-gradient(135deg,var(--blue3),var(--blue));color:#fff;box-shadow:0 4px 20px rgba(0,102,255,.4)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(0,102,255,.6)}
.btn-secondary{background:var(--glass);color:var(--tx);border:1.5px solid var(--border)}
.btn-secondary:hover{border-color:var(--blue);background:var(--glass2)}
.btn-danger{background:rgba(255,61,113,.1);color:var(--danger);border:1px solid rgba(255,61,113,.25)}
.btn-success{background:rgba(0,229,160,.1);color:var(--success);border:1px solid rgba(0,229,160,.25)}
.btn-warn{background:rgba(255,179,64,.1);color:var(--warn);border:1px solid rgba(255,179,64,.25)}
.btn-sm{padding:6px 13px;font-size:12px}
.btn-xs{padding:4px 10px;font-size:11px}
.btn-icon{padding:8px;border-radius:10px;aspect-ratio:1}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.w100{width:100%;justify-content:center}

.inp{width:100%;background:rgba(0,212,255,.04);border:1.5px solid var(--border);border-radius:var(--r2);padding:11px 14px;color:var(--tx);font-size:14px;transition:all .3s;outline:none;font-family:var(--f)}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,212,255,.08)}
.inp::placeholder{color:var(--tx3)}
select.inp option{background:var(--bg3);color:var(--tx)}
.lbl{display:block;font-size:11.5px;font-weight:700;color:var(--tx3);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.form-group{display:flex;flex-direction:column;margin-bottom:14px}

.card{background:rgba(7,11,20,.6);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--r);padding:18px;transition:all .25s;position:relative;overflow:hidden}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.15),transparent)}
.card-glow{border-color:var(--blue);box-shadow:0 0 30px rgba(0,102,255,.15),var(--sh)}
.card-title{font-family:var(--fd);font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700}
.badge-success{background:rgba(0,229,160,.12);color:var(--success);border:1px solid rgba(0,229,160,.2)}
.badge-danger{background:rgba(255,61,113,.12);color:var(--danger);border:1px solid rgba(255,61,113,.2)}
.badge-warn{background:rgba(255,179,64,.12);color:var(--warn);border:1px solid rgba(255,179,64,.2)}
.badge-info{background:rgba(0,212,255,.12);color:var(--blue);border:1px solid rgba(0,212,255,.2)}
.badge-gold{background:rgba(255,215,0,.12);color:var(--gold);border:1px solid rgba(255,215,0,.2)}
.badge-neutral{background:rgba(255,255,255,.06);color:var(--tx2);border:1px solid var(--border3)}

/* KPI Cards */
.kpi{background:rgba(7,11,20,.8);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;transition:all .3s}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--kc,var(--blue)),transparent);opacity:.6}
.kpi::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;background:radial-gradient(circle,var(--kc,var(--blue)),transparent 70%);opacity:.06}
.kpi:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--glow),var(--sh)}

(function initParticles(){
  const c=document.getElementById('particle-canvas');
  const ctx=c.getContext('2d');
  let W,H,particles=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  resize();
  window.addEventListener('resize',resize);
  for(let i=0;i<60;i++){
    particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.5+.5,a:Math.random()*.5+.1})
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(0,153,255,${p.a})`;ctx.fill();
    });
    // draw connections
    particles.forEach((p,i)=>{
      particles.slice(i+1).forEach(p2=>{
        const d=Math.hypot(p.x-p2.x,p.y-p2.y);
        if(d<120){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p2.x,p2.y);ctx.strokeStyle=`rgba(0,102,255,${.12*(1-d/120)})`;ctx.lineWidth=.5;ctx.stroke()}
      })
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// TOAST

function toast(type='info',title,msg=''){
  const tw=document.getElementById('toast-wrap');
  const t=document.createElement('div');
  t.className='toast';
  const c={success:'#00E5A0',error:'#FF3D71',warn:'#FFB340',info:'#00D4FF'};
  const ic={success:'✓',error:'✕',warn:'!',info:'i'};
  t.innerHTML=`<div class="toast-bar" style="background:${c[type]||c.info};box-shadow:0 0 8px ${c[type]||c.info}"></div><div style="flex:1"><div style="font-size:12px;font-weight:700;color:${c[type]||c.info};text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">${ic[type]||'·'} ${title}</div><div class="fs12 c2">${msg}</div></div><button class="toast-close" onclick="this.parentElement.remove()">✕</button>`;
  tw.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(-10px)';t.style.transition='all .3s';setTimeout(()=>t.remove(),300)},3500);
}

let activeModal=null;

  closeModal();
  const ov=document.createElement('div');
  ov.className='overlay no-print';
  ov.id='modal-overlay';
  ov.innerHTML=`<div class="modal${lg?' modal-lg':''}">${html}</div>`;

  activeModal=ov;
}

function openGlobalSearch(){
  openModal(`
  <div class="modal-hd"><div class="modal-title">🔍 Search Everything</div><button class="btn btn-secondary btn-icon btn-sm" onclick="closeModal()">✕</button></div>
  <div class="modal-bd">
    <div class="search-box mb12"><span>🔍</span><input id="gs-inp" placeholder="Products, customers, invoices…" oninput="globalSearch(this.value)" autofocus style="font-size:15px"></div>
    <div id="gs-results"><div class="c3 ta-c fs13" style="padding:20px">Start typing to search…</div></div>
  </div>`);
  setTimeout(()=>document.getElementById('gs-inp')?.focus(),100);

function globalSearch(q){
  const el=document.getElementById('gs-results');
  if(!q.trim()){el.innerHTML='<div class="c3 ta-c fs13" style="padding:20px">Start typing…</div>';return;}
  const ql=q.toLowerCase();const results=[];
  S.products.filter(p=>p.name.toLowerCase().includes(ql)).slice(0,3).forEach(p=>results.push({icon:p.img,label:p.name,sub:`Stock: ${p.qty} · ${fmt(p.price)}`,action:`closeModal();nav('inventory')`}));
  S.customers.filter(c=>c.name.toLowerCase().includes(ql)||c.phone.includes(q)).slice(0,3).forEach(c=>results.push({icon:'👤',label:c.name,sub:`${c.phone} · Due: ${fmt(c.due)}`,action:`closeModal();viewCustomer('${c.id}')`}));
  S.invoices.filter(i=>i.id.toLowerCase().includes(ql)||i.cname.toLowerCase().includes(ql)).slice(0,3).forEach(i=>results.push({icon:'🧾',label:i.id,sub:`${i.cname} · ${fmt(i.total)}`,action:`closeModal();viewInvoice('${i.id}')`}));
  if(!results.length){el.innerHTML=`<div class="c3 ta-c" style="padding:20px">No results for "${q}"</div>`;return;}
  el.innerHTML=results.map(r=>`<div class="fg" style="padding:11px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:all .15s;margin-bottom:4px" onmouseenter="this.style.background='rgba(0,212,255,.06)';this.style.borderColor='var(--border)'" onmouseleave="this.style.background='';this.style.borderColor='transparent'" onclick="${r.action}"><div style="font-size:24px;width:38px;text-align:center">${r.icon}</div><div style="flex:1;min-width:0"><div class="fs14 fw7">${r.label}</div><div class="fs12 c3">${r.sub}</div></div></div>`).join('');
}

function renderPage(page){
  const body=document.getElementById('page-body');
  if(body)body.scrollTo(0,0);
  const map={
    dashboard:renderDashboard,
    inventory:renderInventory,
    billing:renderBilling,
    customers:renderCustomers,
    staff:renderStaff,
    expenses:renderExpenses,
    analytics:renderAnalytics,
    reports:renderReports,
    settings:renderSettings,
    more:renderMore,
  };
  (map[page]||renderDashboard)();
}

function renderDashboard(){
  const totalSales=S.invoices.reduce((s,i)=>s+i.paid,0);

  document.getElementById('fab-btn').textContent='+';
  setContent(`
  <div class="fb mb16">
    <div>
      <div class="fd-font fw8" style="font-size:20px">Good ${hour()} 👋</div>

    </div>
    <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--blue3),var(--blue));display:flex;align-items:center;justify-content:center;font-size:${S.user?.avatar?.startsWith('data:')?'0':'16'}px;font-family:var(--fd);font-weight:800;cursor:pointer;box-shadow:0 0 20px rgba(0,102,255,.4);overflow:hidden;border:2px solid rgba(0,212,255,.3)" class="user-avatar-display" onclick="openPFPModal()">${S.user?.avatar?.startsWith('data:')?`<img src="${S.user.avatar}" style="width:100%;height:100%;object-fit:cover">`:(S.user?.avatar||S.user?.name?.[0]||'A')}</div>
  </div>

  <div class="insight-card mb16">
    <div class="fd-font fw7 fs13 mb4">🤖 AI Smart Insight</div>
    <p>Your peak sales are on <strong style="color:var(--blue)">Thursday & Friday</strong>. Consider stocking up by Wednesday. ${lowStock.length>0?`<strong style="color:var(--warn)">${lowStock.length} products</strong> need reorder.`:''} Revenue trend is <strong style="color:var(--success)">↑ 18%</strong> vs last week.</p>
  </div>

  <div class="g2 mb12">
    ${kpiCard('💵','Revenue',fmt(totalSales),'var(--blue)','↑ 18% this week','cs')}
    ${kpiCard('⏳','Pending',fmt(totalDue),'var(--warn)',dues()+' invoices','cw')}
  </div>
  <div class="g2 mb16">
    ${kpiCard('📈','Net Profit',fmt(profit),'var(--success)',profit>0?`${((profit/Math.max(totalSales,1))*100).toFixed(0)}% margin`:'Review costs',profit>=0?'cs':'cd')}
    ${kpiCard('💸','Expenses',fmt(totalExp),'var(--danger)','This month','cd')}
  </div>

  <div class="card mb12">
    <div class="fb mb12">
      <div class="card-title" style="margin-bottom:0">📊 Weekly Revenue</div>
      <span class="badge badge-success">↑ 18%</span>
    </div>
    <div class="chart-bars">
      ${wk.map((d,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%">
        <div style="flex:1;width:100%;display:flex;align-items:flex-end">
          <div class="chart-bar${i===5?' hi':''}" style="height:${Math.max((d.v/maxW)*100,5)}%;width:100%" title="${d.l}: ${fmt(d.v)}"></div>
        </div>
        <div style="font-size:9px;color:var(--tx3);font-weight:700;text-transform:uppercase">${d.l}</div>

    <div class="chart-footer">
      <div class="cf-item"><div class="cf-val" style="color:var(--blue)">${fmt(totalSales+totalExp)}</div><div class="cf-lbl">Revenue</div></div>

      <div class="cf-item"><div class="cf-val cd">${fmt(totalExp)}</div><div class="cf-lbl">Expenses</div></div>

  <div class="g3 mb12">
    <div class="card ta-c" style="padding:14px;cursor:pointer" onclick="nav('billing-new'),openNewInvoice()">

    <div class="fb mb10"><div class="card-title" style="margin-bottom:0">🧾 Recent Transactions</div><button class="btn btn-secondary btn-sm" onclick="nav('billing')">All</button></div>

      <div><div class="fs13 fw7">${inv.cname}</div><div class="fs11 c3">${inv.id} · ${inv.date}</div></div>
      <div style="text-align:right"><div class="fs13 fw7 ${inv.status==='paid'?'cs':inv.status==='partial'?'cw':'cd'}">${fmt(inv.total)}</div><span class="badge ${inv.status==='paid'?'badge-success':inv.status==='partial'?'badge-warn':'badge-danger'} fs10">${inv.status.toUpperCase()}</span></div>
    </div>`).join(''):'<div class="empty" style="padding:24px"><div class="empty-icon">🧾</div><p>No transactions yet</p></div>'}

      <div style="text-align:center"><div class="fd-font fw8 fs20 cp">${S.products.length}</div><div class="fs11 c3">Products</div></div>

      <div style="text-align:center"><div class="fd-font fw8 fs20 cw">${S.invoices.filter(i=>i.due>0).length}</div><div class="fs11 c3">Due Bills</div></div>

}
function dues(){return S.invoices.filter(i=>i.due>0).length}
function kpiCard(icon,label,val,color,sub,subCls){
  return `<div class="kpi" style="--kc:${color};cursor:default">
    <div class="kpi-icon">${icon}</div>
    <div class="kpi-val" style="color:${color}">${val}</div>
    <div class="kpi-lbl">${label}</div>
    <div class="kpi-chg ${subCls}">${sub}</div>
  </div>`;
}

  const filtered=S.products.filter(p=>(invCat==='All'||p.cat===invCat)&&(!invSearch||p.name.toLowerCase().includes(invSearch.toLowerCase())));

  setContent(`
  <div class="fb mb16">
    <div class="fd-font fw8 fs18">📦 Inventory</div>
    <button class="btn btn-primary btn-sm" onclick="openAddProduct()">+ Add Product</button>
  </div>
  <div class="g3 mb14">
    <div class="card ta-c" style="padding:12px"><div class="fd-font fw8 fs20 cp">${S.products.length}</div><div class="fs10 c3 mt2">TOTAL SKUs</div></div>

function viewProduct(id){
  const p=S.products.find(x=>x.id===id);
  if(!p)return;
  const margin=p.price>0?((p.price-p.cost)/p.price*100).toFixed(0):0;
  openModal(`
  <div class="modal-hd"><div class="modal-title">${p.img} ${p.name}</div><button class="btn btn-secondary btn-icon btn-sm" onclick="closeModal()">✕</button></div>
  <div class="modal-bd">
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:64px;padding:20px;background:var(--glass);border-radius:var(--r);border:1px solid var(--border);display:inline-block;box-shadow:0 0 30px rgba(0,102,255,.1)">${p.img}</div>
    </div>
    <div class="g2 mb12">
      <div class="card" style="padding:12px;text-align:center"><div class="fd-font fw8 fs18 cp">${fmt(p.price)}</div><div class="fs10 c3 mt2">SELLING PRICE</div></div>
      <div class="card" style="padding:12px;text-align:center"><div class="fd-font fw8 fs18 cs">${margin}%</div><div class="fs10 c3 mt2">MARGIN</div></div>
    </div>
    <div class="card mb12">
      <div class="setting-row" style="padding:8px 0"><span class="c3 fs12">SKU</span><span class="fw7 fs13">${p.sku}</span></div>
      <div class="setting-row" style="padding:8px 0"><span class="c3 fs12">Category</span><span class="fw7 fs13">${p.cat}</span></div>
      <div class="setting-row" style="padding:8px 0"><span class="c3 fs12">Cost Price</span><span class="fw7 fs13">${fmt(p.cost)}</span></div>
      <div class="setting-row" style="padding:8px 0"><span class="c3 fs12">Stock</span><span class="fw7 fs13 ${p.qty<=0?'cd':p.qty<=p.low?'cw':'cs'}">${p.qty} ${p.unit}</span></div>
      <div class="setting-row" style="padding:8px 0"><span class="c3 fs12">Min Level</span><span class="fw7 fs13">${p.low} ${p.unit}</span></div>
    </div>
    <div class="stock-adjust mb12">
      <div class="lbl">Quick Stock Adjust</div>
      <div class="fg gap8">
        <button class="btn btn-danger btn-sm" onclick="adjustStock('${p.id}',-1)">− 1</button>
        <button class="btn btn-danger btn-sm" onclick="adjustStock('${p.id}',-5)">− 5</button>
        <span class="fd-font fw8 fs16 cp" style="flex:1;text-align:center" id="stock-disp-${p.id}">${p.qty}</span>
        <button class="btn btn-success btn-sm" onclick="adjustStock('${p.id}',5)">+ 5</button>
        <button class="btn btn-success btn-sm" onclick="adjustStock('${p.id}',1)">+ 1</button>
      </div>
    </div>
    <div class="fg gap8">
      <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="editProduct('${p.id}')">✏️ Edit</button>
      <button class="btn btn-danger" onclick="deleteProduct('${p.id}')">🗑 Delete</button>
    </div>
  </div>`);
}
function adjustStock(id,delta){
  const p=S.products.find(x=>x.id===id);
  if(!p)return;
  p.qty=Math.max(0,p.qty+delta);
  const el=document.getElementById('stock-disp-'+id);
  if(el)el.textContent=p.qty;
  save();toast('success','Stock Updated',`${p.name}: ${p.qty} ${p.unit}`);
}
function openAddProduct(pid){
  const p=pid?S.products.find(x=>x.id===pid):{id:'',name:'',cat:'Grocery',price:'',cost:'',qty:'',low:'',unit:'pcs',img:'📦',sku:''};
  const emojis=['📦','🍚','🥦','🍕','💊','👗','📱','🔧','🏋️','📚','🍰','⚙️','🥤','🫘','🧴','🧈','🍜','🪥','🍪','🫙'];
  openModal(`
  <div class="modal-hd"><div class="modal-title">${pid?'Edit':'Add'} Product</div><button class="btn btn-secondary btn-icon btn-sm" onclick="closeModal()">✕</button></div>
  <div class="modal-bd">
    <div class="form-group"><label class="lbl">Product Icon</label><div style="display:flex;flex-wrap:wrap;gap:5px">${emojis.map(e=>`<button id="em-${e}" onclick="document.getElementById('prod-img-inp').value='${e}';document.querySelectorAll('.em-btn').forEach(b=>b.style.borderColor='var(--border)');this.style.borderColor='var(--blue)'" class="em-btn" style="width:38px;height:38px;font-size:18px;border-radius:8px;border:2px solid ${(p.img||'📦')===e?'var(--blue)':'var(--border)'};background:var(--glass);cursor:pointer;transition:all .2s">${e}</button>`).join('')}</div><input type="hidden" id="prod-img-inp" value="${p.img||'📦'}"></div>
    <div class="form-group"><label class="lbl">Product Name *</label><input class="inp" id="p-name" value="${p.name}" placeholder="e.g. Basmati Rice"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group"><label class="lbl">Category</label><select class="inp" id="p-cat">${['Grocery','Dairy','Snacks','Beverages','Personal Care','Electronics','Clothing','Other'].map(c=>`<option ${p.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="form-group"><label class="lbl">SKU</label><input class="inp" id="p-sku" value="${p.sku}" placeholder="GR001"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group"><label class="lbl">Selling Price ₹</label><input class="inp" id="p-price" type="number" value="${p.price}" placeholder="0"></div>
      <div class="form-group"><label class="lbl">Cost Price ₹</label><input class="inp" id="p-cost" type="number" value="${p.cost}" placeholder="0"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
      <div class="form-group"><label class="lbl">Qty</label><input class="inp" id="p-qty" type="number" value="${p.qty}" placeholder="0"></div>
      <div class="form-group"><label class="lbl">Min Stock</label><input class="inp" id="p-low" type="number" value="${p.low}" placeholder="10"></div>
      <div class="form-group"><label class="lbl">Unit</label><select class="inp" id="p-unit">${['pcs','kg','g','litre','ml','box','pack'].map(u=>`<option ${p.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
    </div>
    <button class="btn btn-primary w100 mt4" onclick="saveProduct('${pid||''}')">💾 Save Product</button>
  </div>`);
}
function editProduct(id){closeModal();openAddProduct(id)}
function saveProduct(pid){
  const name=document.getElementById('p-name')?.value.trim();
  const price=parseFloat(document.getElementById('p-price')?.value)||0;
  if(!name){toast('error','Required','Enter product name');return;}
  const data={
    name,cat:document.getElementById('p-cat')?.value,
    price,cost:parseFloat(document.getElementById('p-cost')?.value)||0,
    qty:parseInt(document.getElementById('p-qty')?.value)||0,
    low:parseInt(document.getElementById('p-low')?.value)||10,
    unit:document.getElementById('p-unit')?.value,
    img:document.getElementById('prod-img-inp')?.value||'📦',
    sku:document.getElementById('p-sku')?.value||genId('SKU'),
    barcode:'',
  };
  if(pid){const p=S.products.find(x=>x.id===pid);if(p)Object.assign(p,data);}
  else S.products.push({id:genId('P'),...data});
  save();closeModal();renderInventory();toast('success','Saved',`${name} ${pid?'updated':'added'}`);
}
function deleteProduct(id){
  if(!confirm('Delete this product?'))return;
  S.products=S.products.filter(p=>p.id!==id);
  save();closeModal();renderInventory();toast('info','Deleted','Product removed');
}

  const totalRev=S.invoices.reduce((s,i)=>s+i.paid,0);

  setContent(`
  <div class="fb mb16">

let billItems=[],billCust={id:'',name:'Walk-in Customer'};
function openNewInvoice(){
  billItems=[];billCust={id:'',name:'Walk-in Customer'};
  renderInvoiceBuilder();
}
function renderInvoiceBuilder(){
  const subtotal=billItems.reduce((s,i)=>s+i.total,0);
  const gst=Math.round(subtotal*0.18);
  const total=subtotal+gst;
  openModal(`
  <div class="modal-hd"><div class="modal-title">🧾 New Invoice</div><button class="btn btn-secondary btn-icon btn-sm" onclick="closeModal()">✕</button></div>
  <div class="modal-bd">
    <div class="form-group"><label class="lbl">Customer</label>
      <select class="inp" id="bill-cust" onchange="const c=S.customers.find(x=>x.id===this.value);if(c){billCust={id:c.id,name:c.name}}else{billCust={id:'',name:'Walk-in Customer'}}">
        <option value="">Walk-in Customer</option>
        ${S.customers.map(c=>`<option value="${c.id}" ${billCust.id===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label class="lbl">Add Products</label>
      <select class="inp" id="bill-prod" onchange="addBillItem(this.value);this.value=''">
        <option value="">Select product to add…</option>
        ${S.products.map(p=>`<option value="${p.id}">${p.img} ${p.name} — ${fmt(p.price)}</option>`).join('')}
      </select>
    </div>
    ${billItems.length?`
    <div class="tbl-wrap mb12">
      <table>
        <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead>

            <td class="c3">${fmt(item.price)}</td>
            <td class="fw7">${fmt(item.total)}</td>
            <td><button style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px" onclick="billItems.splice(${i},1);renderInvoiceBuilder()">✕</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="card mb12" style="padding:12px;background:rgba(0,212,255,.04)">
      <div class="fb mb4"><span class="c3 fs12">Subtotal</span><span class="fw7">${fmt(subtotal)}</span></div>
      <div class="fb mb4"><span class="c3 fs12">GST 18%</span><span class="fw7">${fmt(gst)}</span></div>
      <div class="divider" style="margin:6px 0"></div>
      <div class="fb"><span class="fd-font fw8 fs14 cp">Total</span><span class="fd-font fw8 fs18 cp">${fmt(total)}</span></div>
    </div>
    <div class="form-group"><label class="lbl">Payment Mode</label>
      <select class="inp" id="bill-pmode">
        ${['Cash','UPI','Card','Credit'].map(m=>`<option>${m}</option>`).join('')}
      </select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn btn-secondary" style="justify-content:center" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="justify-content:center" onclick="saveInvoice()">Save Invoice 💾</button>
    </div>`:`<div class="empty" style="padding:24px"><div class="empty-icon">🛒</div><p>Select products to add to invoice</p></div>`}
  </div>`);
}
function addBillItem(pid){
  if(!pid)return;
  const p=S.products.find(x=>x.id===pid);
  if(!p)return;
  const ex=billItems.find(x=>x.pid===pid);
  if(ex){ex.qty++;ex.total=ex.qty*ex.price;}
  else billItems.push({pid:p.id,name:p.name,qty:1,price:p.price,total:p.price});
  renderInvoiceBuilder();
}
function saveInvoice(){
  if(!billItems.length){toast('error','Empty','Add at least one product');return;}
  const subtotal=billItems.reduce((s,i)=>s+i.total,0);
  const gst=Math.round(subtotal*0.18);
  const total=subtotal+gst;
  const pmode=document.getElementById('bill-pmode')?.value||'Cash';
  const custEl=document.getElementById('bill-cust');
  const cid=custEl?.value||'';
  const cust=cid?S.customers.find(x=>x.id===cid):null;
  const cname=cust?cust.name:'Walk-in Customer';
  const isCredit=pmode==='Credit';
  const inv={
    id:`INV-${String(S.invoices.length+1).padStart(3,'0')}`,
    cid,cname,items:[...billItems],subtotal,gst,total,
    paid:isCredit?0:total,due:isCredit?total:0,
    status:isCredit?'unpaid':'paid',date:today(),pmode,note:'',
    cgst:Math.round(gst/2),sgst:Math.round(gst/2)
  };
  S.invoices.push(inv);
  // Update customer
  if(cust){cust.paid+=inv.paid;cust.due+=inv.due;cust.purchases++;cust.pts+=Math.floor(subtotal/100);}
  // Reduce stock
  billItems.forEach(item=>{const p=S.products.find(x=>x.id===item.pid);if(p)p.qty=Math.max(0,p.qty-item.qty)});
  save();closeModal();renderBilling();
  toast('success','Invoice Created',`${inv.id} · ${fmt(total)}`);
}
function viewInvoice(id){
  const inv=S.invoices.find(x=>x.id===id);
  if(!inv)return;
  openModal(`
  <div class="modal-hd"><div class="modal-title">🧾 ${inv.id}</div><button class="btn btn-secondary btn-icon btn-sm" onclick="closeModal()">✕</button></div>
  <div class="modal-bd">
    <div style="background:linear-gradient(135deg,rgba(0,59,255,.12),rgba(0,212,255,.06));border:1px solid var(--border2);border-radius:var(--r);padding:16px;margin-bottom:14px;position:relative">
      <div class="fs10 c3 mb8" style="letter-spacing:1px;text-transform:uppercase">Invoice · ${S.shop?.name}</div>
      <div class="fb mb8"><div><div class="fw7 fs15">${inv.cname}</div><div class="fs12 c3">${inv.date} · ${inv.pmode}</div></div><span class="badge ${inv.status==='paid'?'badge-success':inv.status==='partial'?'badge-warn':'badge-danger'} fs11">${inv.status.toUpperCase()}</span></div>
      <div class="divider"></div>
      ${inv.items.map(item=>`<div class="fb" style="padding:5px 0"><span class="fs13">${item.name} × ${item.qty}</span><span class="fs13 fw7">${fmt(item.total)}</span></div>`).join('')}
      <div class="divider"></div>
      <div class="fb mb4"><span class="fs12 c3">Subtotal</span><span class="fw7">${fmt(inv.subtotal)}</span></div>
      <div class="fb mb4"><span class="fs12 c3">CGST</span><span class="fw7">${fmt(inv.cgst)}</span></div>
      <div class="fb mb4"><span class="fs12 c3">SGST</span><span class="fw7">${fmt(inv.sgst)}</span></div>
      <div class="fb"><span class="fd-font fw8 fs15">TOTAL</span><span class="fd-font fw8 fs20 cp">${fmt(inv.total)}</span></div>
      ${inv.due>0?`<div class="fb mt8" style="background:rgba(255,179,64,.1);padding:8px 12px;border-radius:var(--r2);border:1px solid rgba(255,179,64,.2)"><span class="fs13 fw7 cw">Due Amount</span><span class="fs15 fw8 cw">${fmt(inv.due)}</span></div>`:''}
    </div>
    ${inv.due>0?`<div class="fg gap8 mb12"><button class="btn btn-success" style="flex:1;justify-content:center" onclick="markPaid('${inv.id}')">✓ Mark Paid</button><button class="btn btn-warn" style="flex:1;justify-content:center" onclick="markPartial('${inv.id}')">Partial</button></div>`:''}
    <div class="fg gap8">
      <button class="btn btn-secondary" style="flex:1;justify-content:center" onclick="window.print()">🖨 Print</button>
      <button class="btn btn-success btn-sm" onclick="sendInvoiceWhatsApp('${inv.id}')" style="background:rgba(37,211,102,.15);color:#25D366;border:1px solid rgba(37,211,102,.3)">💬 WhatsApp</button>
      <button class="btn btn-danger btn-sm" onclick="deleteInvoice('${inv.id}')">🗑</button>
    </div>
  </div>`);
}
function markPaid(id){
  const inv=S.invoices.find(x=>x.id===id);if(!inv)return;
  inv.paid=inv.total;inv.due=0;inv.status='paid';
  const c=S.customers.find(x=>x.id===inv.cid);if(c){c.paid+=inv.due;c.due=Math.max(0,c.due-inv.due)}
  save();closeModal();renderBilling();toast('success','Marked Paid',inv.id);
}
function markPartial(id){
  const amt=parseFloat(prompt('Enter amount received:'));if(!amt)return;
  const inv=S.invoices.find(x=>x.id===id);if(!inv)return;
  inv.paid+=amt;inv.due=Math.max(0,inv.total-inv.paid);inv.status=inv.due>0?'partial':'paid';
  save();closeModal();renderBilling();toast('success','Payment Recorded',`${fmt(amt)} received`);
}
function deleteInvoice(id){if(!confirm('Delete invoice?'))return;S.invoices=S.invoices.filter(x=>x.id!==id);save();closeModal();renderBilling();toast('info','Deleted','Invoice removed')}

function renderAttendance(){
  if(!S.staff.length)return'<div class="empty"><div class="empty-icon">📅</div><h3>No staff found</h3></div>';
  const now=new Date();
  const daysInMonth=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const dayLabels=['Su','Mo','Tu','We','Th','Fr','Sa'];
  return S.staff.map(st=>{
    const att=S.attendance[st.id]||{};
    const presentDays=Object.values(att).filter(v=>v==='present').length;
    const halfDays=Object.values(att).filter(v=>v==='half').length;
    const absentDays=Object.values(att).filter(v=>v==='absent').length;
    return `<div class="card mb12">
      <div class="fb mb10"><div class="fg gap8"><div class="staff-av" style="width:36px;height:36px;border-radius:10px;font-size:14px">${st.name[0]}</div><div><div class="fs13 fw7">${st.name}</div><div class="fs11 c3">${st.role}</div></div></div><span class="badge badge-success fs10">${presentDays}P · ${halfDays}H · ${absentDays}A</span></div>
      <div class="att-grid">
        ${dayLabels.map(d=>`<div class="fs9 fw7 c3 ta-c">${d}</div>`).join('')}
        ${Array.from({length:daysInMonth},(_,i)=>{
          const d=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;
          const status=att[d]||'';
          const isToday=i+1===now.getDate();
          return `<div class="att-cell ${status}${isToday?' today':''}" onclick="toggleAttendance('${st.id}','${d}')" title="${i+1}">${i+1}</div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}
function renderPayroll(){
  const totalPayroll=S.staff.reduce((s,st)=>s+st.salary,0);
  return `<div class="insight-card mb12"><div class="fd-font fw7 fs13 mb4">📊 Monthly Payroll</div><p>Total payroll this month: <strong style="color:var(--blue)">${fmt(totalPayroll)}</strong>. ${S.staff.length} staff members.</p></div>
  ${S.staff.map(st=>{
    const att=S.attendance[st.id]||{};
    const present=Object.values(att).filter(v=>v==='present').length;
    const half=Object.values(att).filter(v=>v==='half').length;
    const daysInMonth=new Date().getDate();
    const earned=Math.round((st.salary/daysInMonth)*(present+half*0.5));
    return `<div class="card mb10"><div class="fb mb8"><div class="fg gap8"><div class="staff-av" style="width:36px;height:36px;border-radius:10px;font-size:14px">${st.name[0]}</div><div><div class="fs13 fw7">${st.name}</div><div class="fs11 c3">${st.role}</div></div></div><div style="text-align:right"><div class="fd-font fw8 fs16 cp">${fmt(earned)}</div><div class="fs10 c3">earned</div></div></div>
      <div class="pbar"><div class="pbar-fill" style="width:${Math.min(earned/st.salary*100,100)}%;background:linear-gradient(90deg,var(--blue3),var(--blue))"></div></div>
      <div class="fb mt6"><span class="fs11 c3">Salary: ${fmt(st.salary)}</span><span class="fs11 c3">${present}P + ${half}H days</span></div>
      <button class="btn btn-success btn-xs mt8" onclick="toast('success','Paid',st.name+' salary marked paid')">Mark Salary Paid ✓</button>
    </div>`;
  }).join('')}`;
}
function markToday(sid,status){
  const now=new Date();
  const d=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  if(!S.attendance[sid])S.attendance[sid]={};
  S.attendance[sid][d]=status;
  const st=S.staff.find(x=>x.id===sid);
  save();renderStaff();toast('success','Attendance Marked',`${st?.name||'Staff'}: ${status}`);
}
function toggleAttendance(sid,date){
  if(!S.attendance[sid])S.attendance[sid]={};
  const cur=S.attendance[sid][date];
  const next=cur==='present'?'absent':cur==='absent'?'half':'present';
  S.attendance[sid][date]=next;
  save();renderStaff();
}
function openAddStaff(sid){
  const st=sid?S.staff.find(x=>x.id===sid):{id:'',name:'',role:'Cashier',phone:'',salary:'',join:''};
  openModal(`
  <div class="modal-hd"><div class="modal-title">${sid?'Edit':'Add'} Staff</div><button class="btn btn-secondary btn-icon btn-sm" onclick="closeModal()">✕</button></div>
  <div class="modal-bd">
    <div class="form-group"><label class="lbl">Full Name *</label><input class="inp" id="st-name" value="${st.name}" placeholder="Staff name"></div>
    <div class="form-group"><label class="lbl">Role</label><select class="inp" id="st-role">${['Manager','Cashier','Sales','Delivery','Accountant','Helper'].map(r=>`<option ${st.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
    <div class="form-group"><label class="lbl">Phone</label><input class="inp" id="st-phone" value="${st.phone}" placeholder="9876543210" type="tel"></div>
    <div class="form-group"><label class="lbl">Monthly Salary ₹</label><input class="inp" id="st-salary" value="${st.salary}" type="number" placeholder="15000"></div>
    <div class="form-group"><label class="lbl">Joining Date</label><input class="inp" id="st-join" value="${st.join}" type="date"></div>
    <button class="btn btn-primary w100" onclick="saveStaff('${sid||''}')">💾 Save</button>
  </div>`);
}
function saveStaff(sid){
  const name=document.getElementById('st-name')?.value.trim();
  if(!name){toast('error','Required','Enter staff name');return;}
  const data={name,role:document.getElementById('st-role')?.value,phone:document.getElementById('st-phone')?.value||'',salary:parseInt(document.getElementById('st-salary')?.value)||0,join:document.getElementById('st-join')?.value||'',status:'active'};
  if(sid){const st=S.staff.find(x=>x.id===sid);if(st)Object.assign(st,data);}
  else{const id=genId('ST');S.attendance[id]={};S.staff.push({id,...data});}
  save();closeModal();renderStaff();toast('success','Saved',name);
}

function openAddExpense(eid){

  openModal(`

    <div class="form-group"><label class="lbl">Status</label><select class="inp" id="e-paid"><option value="0" ${!e.paid?'selected':''}>Unpaid</option><option value="1" ${e.paid?'selected':''}>Paid</option></select></div>
    <div class="fg gap8">
      <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="saveExpense('${eid||''}')">💾 Save</button>
      ${eid?`<button class="btn btn-danger" onclick="deleteExpense('${eid}')">🗑</button>`:''}
    </div>
  </div>`);

function openEditExpense(id){openAddExpense(id)}
function saveExpense(eid){
  const desc=document.getElementById('e-desc')?.value.trim();
  const amt=parseFloat(document.getElementById('e-amt')?.value)||0;
  if(!desc||!amt){toast('error','Required','Enter description and amount');return;}
  const data={cat:document.getElementById('e-cat')?.value,desc,amt,date:document.getElementById('e-date')?.value||today(),paid:document.getElementById('e-paid')?.value==='1'};
  if(eid){const e=S.expenses.find(x=>x.id===eid);if(e)Object.assign(e,data);}
  else S.expenses.push({id:genId('E'),...data});
  save();closeModal();renderExpenses();toast('success','Saved',desc);
}
function deleteExpense(id){if(!confirm('Delete expense?'))return;S.expenses=S.expenses.filter(x=>x.id!==id);save();closeModal();renderExpenses();toast('info','Deleted')}

    <div class="fg gap16 mt10"><div class="fi gap6"><div style="width:8px;height:8px;border-radius:2px;background:var(--blue)"></div><span class="fs11 c2">Revenue</span></div><div class="fi gap6"><div style="width:8px;height:8px;border-radius:2px;background:var(--danger)"></div><span class="fs11 c2">Expenses</span></div></div>

function exportData(){
  const data=JSON.stringify(S,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`mydukaan-backup-${Date.now()}.json`;a.click();
  toast('success','Exported','Backup file downloaded');
}

function animCounter(id,target,suffix,duration){
  const el=document.getElementById(id);if(!el)return;
  const step=Math.ceil(target/60);let cur=0;
  const timer=setInterval(()=>{cur=Math.min(cur+step,target);
    const disp=target>=1000000?Math.floor(cur/1000000)+'M+':target>=1000?Math.floor(cur/1000)+'K+':cur+'+'
    el.textContent=disp;
    if(cur>=target)clearInterval(timer);
  },duration/60);
}

function startLiveClock(){
  const el=document.getElementById('live-clock');
  if(!el)return;
  const tick=()=>{
    const now=new Date();
    el.textContent=now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    setTimeout(tick,1000);
  };
  tick();
}

function sendInvoiceWhatsApp(id){
  const inv=S.invoices.find(x=>x.id===id);
  if(!inv)return;
  const c=S.customers.find(x=>x.id===inv.cid);
  const phone=c?.phone||'';
  const items=inv.items.map(i=>`  • ${i.name} ×${i.qty} = ${fmt(i.total)}`).join('\n');
  const msg=`🧾 *Invoice from ${S.shop?.name}*\n\nInvoice: *${inv.id}*\nDate: ${inv.date}\n\n${items}\n\n──────────\nSubtotal: ${fmt(inv.subtotal)}\nGST (18%): ${fmt(inv.gst)}\n*Total: ${fmt(inv.total)}*${inv.due>0?`\n⚠️ Due: ${fmt(inv.due)}`:'}\n✅ Fully Paid'}\n\nPayment: ${inv.pmode}\n\nThank you! 🙏\n– ${S.shop?.name}`;
  const url=`https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;
  window.open(url,'_blank');
}

function setPFPEmoji(em){
  const prev=document.getElementById('pfp-preview');
  if(prev)prev.innerHTML=em;
  const inp=document.getElementById('pfp-text');
  if(inp)inp.value=em;
  S._pfpTemp=em;
}
function updatePFPPreview(val){
  const prev=document.getElementById('pfp-preview');
  if(prev&&val)prev.innerHTML=val;
  S._pfpTemp=val;
}
function handlePFPUpload(input){
  const file=input.files[0];
  if(!file)return;
  if(file.size>2097152){toast('error','Too Large','Image must be under 2MB');return;}
  const reader=new FileReader();
  reader.onload=e=>{
    const dataUrl=e.target.result;
    S._pfpTemp=dataUrl;
    const prev=document.getElementById('pfp-preview');
    if(prev)prev.innerHTML=`<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover">`;
    toast('success','Photo Loaded','Click Save to apply');
  };
  reader.readAsDataURL(file);
}
function savePFP(){
  const val=S._pfpTemp||(document.getElementById('pfp-text')?.value)||S.user?.name?.[0]||'A';
  if(S.user)S.user.avatar=val;
  delete S._pfpTemp;
  save();
  // Update avatar displays
  document.querySelectorAll('.user-avatar-display').forEach(el=>{
    const isImg=val.startsWith('data:');
    el.innerHTML=isImg?`<img src="${val}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:(val.length<=3?val:(S.user?.name?.[0]||'A'));
  });
  closeModal();
  toast('success','Photo Updated','Profile photo saved!');
}

function handleQRUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){showToast('Please upload an image file','warn');return;}
  const reader = new FileReader();
  reader.onload = function(ev){
    const dataUrl = ev.target.result;
    localStorage.setItem('md_custom_qr', dataUrl);
    showToast('✅ QR Code saved!','success');
    // Re-open to refresh
    closeModal();
    setTimeout(()=>openQRPayment(0),200);
  };
  reader.readAsDataURL(file);
}

function removeQRCode(){
  localStorage.removeItem('md_custom_qr');
  showToast('QR Code removed','warn');
  closeModal();
  setTimeout(()=>openQRPayment(0),200);
}

function openProfitCalc(){
  openModal(`
  <div class="modal-hd"><div class="modal-title">🧮 Profit Calculator</div><button class="btn btn-secondary btn-icon btn-sm" onclick="closeModal()">✕</button></div>
  <div class="modal-bd">
    <div class="form-group"><label class="lbl">Cost Price ₹</label><input class="inp" id="pc-cost" type="number" placeholder="100" oninput="calcProfit()"></div>
    <div class="form-group"><label class="lbl">Selling Price ₹</label><input class="inp" id="pc-sell" type="number" placeholder="150" oninput="calcProfit()"></div>
    <div class="form-group"><label class="lbl">Quantity</label><input class="inp" id="pc-qty" type="number" placeholder="10" value="1" oninput="calcProfit()"></div>
    <div id="pc-result" style="background:rgba(0,212,255,.06);border:1px solid var(--border2);border-radius:var(--r);padding:16px;display:none">
      <div class="g2" style="gap:10px">
        <div class="ta-c"><div class="fd-font fw8 fs20 cs" id="pc-profit">₹0</div><div class="fs10 c3 mt2">PROFIT</div></div>
        <div class="ta-c"><div class="fd-font fw8 fs20 cp" id="pc-margin">0%</div><div class="fs10 c3 mt2">MARGIN</div></div>
        <div class="ta-c"><div class="fd-font fw8 fs20 cw" id="pc-revenue">₹0</div><div class="fs10 c3 mt2">REVENUE</div></div>
        <div class="ta-c"><div class="fd-font fw8 fs20" id="pc-roi" style="color:var(--gold)">0%</div><div class="fs10 c3 mt2">ROI</div></div>
      </div>
    </div>
  </div>`);
}
function calcProfit(){
  const cost=parseFloat(document.getElementById('pc-cost')?.value)||0;
  const sell=parseFloat(document.getElementById('pc-sell')?.value)||0;
  const qty=parseFloat(document.getElementById('pc-qty')?.value)||1;
  if(!cost||!sell)return;
  const profit=(sell-cost)*qty;
  const margin=sell>0?((sell-cost)/sell*100).toFixed(1):0;
  const revenue=sell*qty;
  const roi=cost>0?((profit/(cost*qty))*100).toFixed(1):0;
  const res=document.getElementById('pc-result');
  if(res){res.style.display='block';
    document.getElementById('pc-profit').textContent=fmt(profit);
    document.getElementById('pc-margin').textContent=margin+'%';
    document.getElementById('pc-revenue').textContent=fmt(revenue);
    document.getElementById('pc-roi').textContent=roi+'%';
    document.getElementById('pc-profit').style.color=profit>=0?'var(--success)':'var(--danger)';
  }
}

function saveBulkStock(){
  let updated=0;
  S.products.forEach(p=>{

  });
  save();closeModal();renderInventory();toast('success','Stock Updated',`${updated} products updated`);
}

    ${kpiCard('💸','Expenses',fmt(totalExp),'var(--danger)','This month','cd')}

      ${['platinum','gold','silver','bronze'].map((t,i)=>{

  </div>
  `);

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();if(S.user&&S.shop)openGlobalSearch();}
  if(e.key==='Escape')closeModal();
});

// SWIPE GESTURE (mobile back)
// ══════════════════════════════════════════
(function initSwipe(){
  let sx=0;
  document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
  document.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx;
    if(dx>80&&sx<30&&document.getElementById('modal-overlay'))closeModal();
  },{passive:true});
})();
